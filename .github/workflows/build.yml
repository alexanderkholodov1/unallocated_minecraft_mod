name: Build

# Real CI runs only on deliverable refs (main, hito branches v*, pull requests), and only on commits that already passed
# a rehearsal. A rehearsal is the same workflow on a temporary rehearsal/* branch: a failing check is recorded in the
# rehearsal-verdict artifact for the worker, and the run itself does not fail (no failure notification). Work in
# progress is backed up to refs/backup/*, which runs nothing. Owner, 2026-10-26: no red run in any CASPIAN project.
on:
  push:
    branches: ['main', 'v[0-9]*', 'rehearsal/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/rehearsal/') }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest API must be rejected by Loader; the other three profiles must start.
        api: ['none', '0.153.1+26.3', '0.161.0+26.3', '0.165.0+26.3']
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          # No wrapper JAR is required; keep in sync with TOOLCHAIN.md.
          gradle-version: '9.8.2'
          # Includes caches/fabric-loom (Minecraft assets, natives and Fabric downloads).
          # setup-gradle's default key includes the matrix; use the shared cache below.
          cache-disabled: true

      - name: Restore shared Gradle dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.gradle/caches
          # Every profile compiles identical sources. Coexistence adds one API download only.
          key: gradle-shared-v1-${{ runner.os }}-${{ runner.arch }}-jdk25-gradle9.8.2-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'fabric-api-modules.json') }}

      - name: Cache Loom project and smoke server downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .gradle/loom-cache
            .tmp/smoke-downloads
          key: minecraft-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'fabric-api-modules.json', 'scripts/smoke_test.py') }}

      - name: Build mod
        run: python3 scripts/smoke_test.py gradle -- build clientSmokeJar prepareCoexistApi -PsmokeApiVersion=${{ matrix.api }}

      - name: Author release template and inject into player JAR
        timeout-minutes: 5
        run: python3 scripts/author_template.py

      - name: Verify contract text matches Appendix C
        run: python3 scripts/contract_text.py --check

      - name: Verify installable JAR, mixin packages and write checksum
        id: package
        run: python3 scripts/verify_jar.py

      - name: Verify packaging, smoke and contract orchestration failure paths without Java
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Smoke test dedicated server (Fabric API ${{ matrix.api }})
        timeout-minutes: 6
        run: python3 scripts/smoke_test.py server --fabric-api-version '${{ matrix.api }}'

      - name: Identify graphics runner image
        id: graphics-image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache headless graphics packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp/headless-debs/*.deb
          key: graphics-v1-${{ runner.arch }}-${{ steps.graphics-image.outputs.version }}-${{ hashFiles('scripts/install_headless_graphics.sh') }}

      - name: Install headless client graphics
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          bash scripts/install_headless_graphics.sh

      - name: Install optional gameplay recorder
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ !cancelled() && steps.package.outcome == 'success' && matrix.api == 'none' }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg); then
              echo 'UNALLOCATED video unavailable: ffmpeg installation failed'
            fi
          fi

      - name: Smoke test client startup or Loader rejection (Fabric API ${{ matrix.api }})
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 26
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: python3 scripts/smoke_test.py client --fabric-api-version '${{ matrix.api }}'

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-${{ github.sha }}-${{ matrix.api }}
          include-hidden-files: true
          path: |
            build/reports/included-jars.json
            .tmp/smoke/gradle-diagnostics/**
            .tmp/smoke/*-console.log
            .tmp/smoke/**/logs/**
            .tmp/smoke/**/logs-first/**
            .tmp/smoke/**/logs-restart/**
            .tmp/smoke/**/logs-story/**
            .tmp/smoke/video/**
            build/template/**
            .tmp/smoke/**/crash-reports/**
            .tmp/smoke/**/hs_err_pid*.log
            .tmp/smoke/**/screenshots/**
            .tmp/smoke/**/screenshots-before-play/**
            .tmp/smoke/client/unallocated/contract.properties
            hs_err_pid*.log
            build/test-results/**
            build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installable mod
        if: ${{ success() && matrix.api == 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unallocated-${{ github.sha }}
          path: |
            build/libs/unallocated-*.jar
            build/libs/unallocated-*.jar.sha256
            build/reports/included-jars.json
          if-no-files-found: error
          retention-days: 14

      - name: Stage judge release
        if: ${{ success() && matrix.api == 'none' }}
        run: python3 scripts/smoke_test.py release

      - name: Upload judge release
        if: ${{ success() && matrix.api == 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unallocated-release-${{ github.sha }}
          path: build/release/**
          if-no-files-found: error
          retention-days: 14

      - name: Record rehearsal verdict
        if: ${{ always() && startsWith(github.ref, 'refs/heads/rehearsal/') }}
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","api":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ matrix.api }}" "${{ job.status }}" \
            > ".tmp/verdict/verdict.json"
          cat .tmp/verdict/verdict.json

      - name: Upload rehearsal verdict
        if: ${{ always() && startsWith(github.ref, 'refs/heads/rehearsal/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-verdict-${{ strategy.job-index }}
          include-hidden-files: true
          path: .tmp/verdict/verdict.json
          retention-days: 3
