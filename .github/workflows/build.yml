name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          # No wrapper JAR is required; keep in sync with TOOLCHAIN.md.
          gradle-version: '9.8.2'
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build mod
        run: gradle --no-daemon --console=plain build clientSmokeJar

      - name: Verify installable JAR and write checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          properties = dict(
              line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
              if line and not line.startswith('#') and '=' in line
          )
          version = properties['version']
          artifact = Path(f'build/libs/unallocated-{version}.jar')
          with ZipFile(artifact) as jar:
              assert jar.testzip() is None, 'Corrupt JAR entry'
              metadata_text = jar.read('fabric.mod.json').decode('utf-8')
              assert '${' not in metadata_text, 'Unexpanded metadata'
              metadata = json.loads(metadata_text)
              assert metadata['id'] == 'unallocated'
              assert metadata['name'] == 'UNALLOCATED'
              assert metadata['version'] == version
              assert set(metadata['entrypoints']) == {'main', 'client'}, 'Test entrypoint leaked into player JAR'
              # Exact core subset; integration with alpha.1.6 uses its shared verifier instead.
              modules = {
                  'fabric-api-base': ('2.0.6+fcdff87f5d', 'e3b64039e8f261cc24a5013cb8b442cf368f08afa28d01ecdf97f3ccdeb7b63c'),
                  'fabric-command-api-v2': ('3.1.2+fcdff87f5d', '58072787b5b5d171a7e65b1eb7a9c006bd48b940e12c870d7b23e0d5173cf2c9'),
                  'fabric-lifecycle-events-v1': ('4.1.9+ffef5f675d', 'fc47f06fa9ce4145ad925164a6eccc436f7ff504cf7d1e766a15699b82cd3e74'),
                  'fabric-networking-api-v1': ('6.4.0+a21c9eb65d', '2c0eac9bb2bd11392834322f196e174e0b82d2d2a8f40db9a2b34020c4cb0646'),
              }
              nested = {f'META-INF/jars/{id}-{version}.jar': digest for id, (version, digest) in modules.items()}
              assert {entry['file'] for entry in metadata.get('jars', [])} == set(nested)
              assert {name for name in jar.namelist() if name.endswith('.jar')} == set(nested)
              for name, digest in nested.items():
                  assert hashlib.sha256(jar.read(name)).hexdigest() == digest, 'Unexpected bundled Fabric module'
              assert not any(name.startswith('org/unallocated/smoke/') or name.endswith('Test.class')
                             for name in jar.namelist()), 'Test classes leaked into player JAR'
              assert 'NOTICE-core.txt' in jar.namelist()
              assert 'assets/unallocated/features.json' in jar.namelist()
              assert metadata['depends'] == {
                  'fabricloader': '>=' + properties['loader_version'],
                  'minecraft': '~' + properties['minecraft_version'],
                  'java': '>=25',
                  **{id: '>=' + version for id, (version, _) in modules.items()},
              }
              for side in ('main', 'client'):
                  for entrypoint in metadata['entrypoints'][side]:
                      bytecode = jar.read(entrypoint.replace('.', '/') + '.class')
                      assert bytecode[:4] == bytes.fromhex('cafebabe')
                      assert int.from_bytes(bytecode[6:8], 'big') == 69, 'Expected Java 25 bytecode'
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          artifact.with_suffix('.jar.sha256').write_text(f'{digest}  {artifact.name}\n')
          print(f'Verified {artifact}')
          PY

      - name: Verify smoke watchdog failure paths without Java
        run: python3 -B -m unittest discover -s scripts -p 'test_smoke_test.py'

      - name: Smoke test dedicated server with player JAR
        timeout-minutes: 6
        run: python3 scripts/smoke_test.py server

      - name: Install headless client graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers

      - name: Smoke test production client to title screen
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: python3 scripts/smoke_test.py client

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-${{ github.sha }}
          include-hidden-files: true
          path: |
            .tmp/smoke/*-console.log
            .tmp/smoke/**/logs/**
            .tmp/smoke/**/crash-reports/**
            .tmp/smoke/**/hs_err_pid*.log
            .tmp/smoke/**/screenshots/**
            hs_err_pid*.log
            build/test-results/test/**
            build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installable mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unallocated-${{ github.sha }}
          path: |
            build/libs/unallocated-*.jar
            build/libs/unallocated-*.jar.sha256
          if-no-files-found: error
          retention-days: 14
