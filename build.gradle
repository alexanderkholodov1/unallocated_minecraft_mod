plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'unallocated'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        unallocated {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Initialization and logging do not require Fabric API.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'java.io.tmpdir', layout.projectDirectory.dir('.tmp/unit').asFile.absolutePath
    doFirst { layout.projectDirectory.dir('.tmp/unit').asFile.mkdirs() }
}

processResources {
    def metadata = [
        version: project.version.toString(),
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version
    ]
    inputs.properties(metadata)

    filesMatching('fabric.mod.json') {
        expand(metadata)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// CI helper mod: a separate source set/JAR, never included in the player's JAR.
sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
    }
}

dependencies {
    clientSmokeImplementation "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
}

tasks.register('clientSmokeJar', Jar) {
    archiveBaseName = 'unallocated-client-smoke'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.clientSmoke.output
}

def clientSmokeDir = layout.projectDirectory.dir('.tmp/smoke/client')
tasks.register('runClientSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // Explicit binary inputs prevent development class directories from masking packaging errors.
    mods.setFrom(tasks.named('jar'), tasks.named('clientSmokeJar'), configurations.productionRuntimeMods)
    runDir = clientSmokeDir
    useXVFB = true
    jvmArgs.addAll('-Xmx1G', '-Dfabric.client.gametest', '-Dunallocated.interface.debug=true', '-Dunallocated.interface.debug.quiet=true')
    jvmArgs.add("-Djava.io.tmpdir=${clientSmokeDir.dir('temp').asFile.absolutePath}")
    jvmArgs.add(tasks.named('jar', Jar).flatMap { it.archiveFile }.map {
        "-Dunallocated.smoke.jar=${it.asFile.absolutePath}".toString()
    })
    doFirst {
        clientSmokeDir.dir('temp').asFile.mkdirs()
    }
}
