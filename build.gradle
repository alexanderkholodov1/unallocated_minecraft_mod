plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'unallocated'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        unallocated {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Reviewed subset and dependency closure; include is deliberately non-transitive.
def bundledFabric = new groovy.json.JsonSlurper().parse(file('fabric-api-modules.json'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    bundledFabric.modules.keySet().each { moduleId ->
        def module = fabricApi.module(moduleId, bundledFabric.fabric_api_version)
        implementation(module) { transitive = false }
        include(module) { transitive = false }
    }
}

processResources {
    def metadata = [
        version: project.version.toString(),
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version
    ]
    bundledFabric.modules.each { id, module ->
        metadata[id.replace('-', '_') + '_version'] = module.version
    }
    inputs.properties(metadata)
    inputs.file('fabric-api-modules.json')

    filesMatching('fabric.mod.json') {
        expand(metadata)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// CI helper mod: a separate source set/JAR, never included in the player's JAR.
sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
    }
}

// Only the test runner is nested in the helper. It must not supply player modules.
configurations {
    clientSmokeHarness { transitive = false }
    coexistApi { transitive = false }
    clientSmokeImplementation.extendsFrom(clientSmokeHarness)
}

dependencies {
    clientSmokeHarness 'net.fabricmc.fabric-api:fabric-client-gametest-api-v1:6.0.11+131f8d475d'
    coexistApi "net.fabricmc.fabric-api:fabric-api:${bundledFabric.fabric_api_version}"
}

tasks.register('prepareCoexistApi', Copy) {
    from configurations.coexistApi
    into layout.buildDirectory.dir('smoke/full-api')
}

tasks.register('clientSmokeJar', Jar) {
    archiveBaseName = 'unallocated-client-smoke'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.clientSmoke.output
    from(configurations.clientSmokeHarness) { into 'META-INF/jars' }
}

def clientSmokeDir = layout.projectDirectory.dir('.tmp/smoke/client')
tasks.register('runClientSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // Explicit binary inputs prevent development class directories from masking packaging errors.
    dependsOn tasks.named('jar')
    mods.setFrom(tasks.named('clientSmokeJar'))
    runDir = clientSmokeDir
    useXVFB = true
    jvmArgs.addAll('-Xmx1G', '-Dfabric.client.gametest')
    jvmArgs.add("-Djava.io.tmpdir=${clientSmokeDir.dir('temp').asFile.absolutePath}")
    jvmArgs.add(tasks.named('jar', Jar).flatMap { it.archiveFile }.map {
        "-Dunallocated.smoke.jar=${it.asFile.absolutePath}".toString()
    })
    doFirst {
        clientSmokeDir.dir('temp').asFile.mkdirs()
        copy {
            from tasks.named('jar', Jar).flatMap { it.archiveFile }
            into clientSmokeDir.dir('mods')
        }
    }
}
