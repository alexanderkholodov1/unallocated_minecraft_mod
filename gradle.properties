org.gradle.jvmargs=-Xmx1G
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# Allow CI runners time to connect to dependency repositories.
systemProp.org.gradle.internal.http.connectionTimeout=60000
# Allow slow dependency downloads on CI to finish before timing out.
systemProp.org.gradle.internal.http.socketTimeout=180000
# Retry transient dependency repository failures on CI.
systemProp.org.gradle.internal.repository.max.retries=6
# Back off between repository retries to let transient CI network failures recover.
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Verified versions and sources: docs/plan/TOOLCHAIN.md
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3

version=0.2.0
group=org.unallocated
